<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Наше весілля: Павло та Світлана</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500;700;800&family=Nunito:wght@300;400;700&family=Raleway:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/themes.js"></script>
  <script src="js/background.js"></script>
</head>
<body>
  <main class="landing">
    <div class="landing__media">
      <div class="landing__frame">
        <img class="landing__photo landing__photo--groom" src="assets/images/img-1.jpeg" alt="Павло в дитинстві">
      </div>
      <div class="landing__frame">
        <img class="landing__photo landing__photo--bride" src="assets/images/img-2.jpeg" alt="Світлана в дитинстві">
      </div>
      <video class="landing__video" id="bg-video" src="assets/videos/promo.mp4" muted loop playsinline preload="none"></video>
    </div>

    <div class="switchers">
      <nav class="themes" id="themes" aria-label="Стиль сайту"></nav>
      <nav class="themes" id="bg-modes" aria-label="Фон"></nav>
    </div>

    <div class="landing__content">
      <div class="landing__decor" aria-hidden="true"></div>

      <header class="intro">
        <p class="intro__subtitle">Запрошуємо на наше весілля</p>
        <h1 class="intro__title">Павло &amp; Світлана</h1>
        <p class="intro__date">23 жовтня 2026 · 15:30</p>
      </header>

      <section class="invite">
        <p class="invite__hint">Введіть прізвище, щоб отримати своє запрошення</p>
        <form class="invite__form" id="invite-form">
          <div class="invite__field">
            <input
              class="invite__input"
              id="guest-name"
              type="text"
              placeholder="Пригарницький"
              autocomplete="off"
              required
            >
            <ul class="suggestions" id="suggestions" hidden></ul>
          </div>
          <button class="invite__button" type="submit">Отримати запрошення</button>
        </form>
        <p class="invite__message" id="invite-message" aria-live="polite"></p>
      </section>
    </div>
  </main>

  <div class="modal" id="video-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="modal__close" type="button" aria-label="Закрити" data-close>&times;</button>
      <video class="modal__video" id="modal-video" controls playsinline></video>
    </div>
  </div>

  <script src="js/guests.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
